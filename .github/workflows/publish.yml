name: Publish
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Publish directly with trusted publishing, or stage the initial package
        type: choice
        default: publish
        options:
          - publish
          - stage
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check API deployment
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' https://api.webdecoy.com/api/automation/v1/connection)
          test "$status" = 401
      - name: Stage bootstrap release with provenance
        if: inputs.mode == 'stage'
        run: npm stage publish --access public --provenance
        env:
          RELEASE_MODE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish with n8n CLI and provenance
        if: inputs.mode == 'publish'
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
